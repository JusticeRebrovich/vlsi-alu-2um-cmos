<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="1050" viewBox="0 0 1600 1050" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>
  .wire{stroke:#111;stroke-width:2;fill:none}
  .thin{stroke:#111;stroke-width:1.4;fill:none}
  .label{font-family:Arial,sans-serif;font-size:18px;fill:#111}
  .small{font-family:Arial,sans-serif;font-size:14px;fill:#111}
  .tiny{font-family:Arial,sans-serif;font-size:12px;fill:#111}
  .title{font-family:Arial,sans-serif;font-size:28px;font-weight:bold;fill:#111}
  .node{fill:#111}
  .dash{stroke:#666;stroke-width:1.3;stroke-dasharray:5,5;fill:none}
</style>
</defs>

<text x="40" y="40" class="title">1-Bit ALU — CMOS Transistor-Level Style</text>
<text x="40" y="68" class="small">Functions: AND, NOR, XOR, ADD. Selection made using three transmission-gate 2:1 muxes.</text>

<!-- rails -->
<line x1="60" y1="105" x2="1500" y2="105" class="wire"/>
<text x="25" y="111" class="label">VDD</text>
<line x1="60" y1="955" x2="1500" y2="955" class="wire"/>
<text x="25" y="961" class="label">GND</text>

<!-- inputs -->
<line x1="80" y1="160" x2="1500" y2="160" class="thin"/>
<line x1="80" y1="200" x2="1500" y2="200" class="thin"/>
<line x1="80" y1="240" x2="1500" y2="240" class="thin"/>
<line x1="80" y1="280" x2="1500" y2="280" class="thin"/>
<line x1="80" y1="320" x2="1500" y2="320" class="thin"/>
<line x1="80" y1="360" x2="1500" y2="360" class="thin"/>
<text x="35" y="166" class="label">A</text>
<text x="35" y="206" class="label">A̅</text>
<text x="35" y="246" class="label">B</text>
<text x="35" y="286" class="label">B̅</text>
<text x="35" y="326" class="label">Cin</text>
<text x="35" y="366" class="label">C̅in</text>

<!-- select rails -->
<line x1="80" y1="815" x2="1500" y2="815" class="thin"/>
<line x1="80" y1="845" x2="1500" y2="845" class="thin"/>
<line x1="80" y1="875" x2="1500" y2="875" class="thin"/>
<line x1="80" y1="905" x2="1500" y2="905" class="thin"/>
<text x="35" y="821" class="label">S0</text>
<text x="35" y="851" class="label">S̅0</text>
<text x="35" y="881" class="label">S1</text>
<text x="35" y="911" class="label">S̅1</text>

<!-- transistor drawing helper manually -->

<!-- AND implemented NAND + inverter -->
<rect x="130" y="410" width="255" height="300" class="dash"/>
<text x="180" y="435" class="label">AND = A·B</text>
<text x="168" y="455" class="tiny">NAND followed by inverter</text>

<!-- NAND pmos parallel -->
<line x1="240" y1="105" x2="240" y2="475" class="wire"/>
<line x1="195" y1="475" x2="285" y2="475" class="wire"/>
<line x1="195" y1="475" x2="195" y2="525" class="wire"/>
<line x1="285" y1="475" x2="285" y2="525" class="wire"/>
<rect x="178" y="498" width="34" height="14" fill="#fff" stroke="#111" stroke-width="2"/>
<rect x="268" y="498" width="34" height="14" fill="#fff" stroke="#111" stroke-width="2"/>
<circle cx="173" cy="505" r="4" fill="#fff" stroke="#111" stroke-width="1.7"/>
<circle cx="263" cy="505" r="4" fill="#fff" stroke="#111" stroke-width="1.7"/>
<line x1="160" y1="505" x2="178" y2="505" class="thin"/>
<line x1="250" y1="505" x2="268" y2="505" class="thin"/>
<line x1="195" y1="525" x2="285" y2="525" class="wire"/>
<text x="150" y="500" class="tiny">A</text>
<text x="242" y="500" class="tiny">B</text>

<!-- NAND nmos series -->
<line x1="240" y1="525" x2="240" y2="565" class="wire"/>
<rect x="223" y="565" width="34" height="14" fill="#fff" stroke="#111" stroke-width="2"/>
<line x1="205" y1="572" x2="223" y2="572" class="thin"/>
<text x="190" y="568" class="tiny">A</text>
<line x1="240" y1="579" x2="240" y2="625" class="wire"/>
<rect x="223" y="625" width="34" height="14" fill="#fff" stroke="#111" stroke-width="2"/>
<line x1="205" y1="632" x2="223" y2="632" class="thin"/>
<text x="190" y="628" class="tiny">B</text>
<line x1="240" y1="639" x2="240" y2="955" class="wire"/>
<circle cx="240" cy="525" r="4" class="node"/>
<line x1="240" y1="525" x2="310" y2="525" class="wire"/>
<text x="275" y="518" class="tiny">NAND</text>

<!-- inverter for AND -->
<line x1="310" y1="525" x2="310" y2="572" class="wire"/>
<rect x="343" y="502" width="34" height="14" fill="#fff" stroke="#111" stroke-width="2"/>
<circle cx="338" cy="509" r="4" fill="#fff" stroke="#111" stroke-width="1.7"/>
<line x1="310" y1="509" x2="343" y2="509" class="thin"/>
<line x1="360" y1="105" x2="360" y2="502" class="wire"/>
<line x1="360" y1="516" x2="360" y2="572" class="wire"/>
<rect x="343" y="572" width="34" height="14" fill="#fff" stroke="#111" stroke-width="2"/>
<line x1="310" y1="579" x2="343" y2="579" class="thin"/>
<line x1="360" y1="586" x2="360" y2="955" class="wire"/>
<line x1="360" y1="544" x2="430" y2="544" class="wire"/>
<text x="400" y="536" class="label">AND</text>

<!-- NOR direct -->
<rect x="445" y="410" width="230" height="300" class="dash"/>
<text x="505" y="435" class="label">NOR</text>
<text x="485" y="455" class="tiny">PMOS series, NMOS parallel</text>
<line x1="555" y1="105" x2="555" y2="485" class="wire"/>
<rect x="538" y="485" width="34" height="14" fill="#fff" stroke="#111" stroke-width="2"/>
<circle cx="533" cy="492" r="4" fill="#fff" stroke="#111" stroke-width="1.7"/>
<line x1="508" y1="492" x2="538" y2="492" class="thin"/>
<text x="492" y="488" class="tiny">A</text>
<line x1="555" y1="499" x2="555" y2="545" class="wire"/>
<rect x="538" y="545" width="34" height="14" fill="#fff" stroke="#111" stroke-width="2"/>
<circle cx="533" cy="552" r="4" fill="#fff" stroke="#111" stroke-width="1.7"/>
<line x1="508" y1="552" x2="538" y2="552" class="thin"/>
<text x="492" y="548" class="tiny">B</text>
<line x1="555" y1="559" x2="555" y2="590" class="wire"/>
<circle cx="555" cy="590" r="4" class="node"/>
<line x1="555" y1="590" x2="700" y2="590" class="wire"/>
<text x="625" y="582" class="label">NOR</text>
<!-- nmos parallel -->
<line x1="555" y1="590" x2="510" y2="650" class="wire"/>
<line x1="555" y1="590" x2="600" y2="650" class="wire"/>
<rect x="493" y="650" width="34" height="14" fill="#fff" stroke="#111" stroke-width="2"/>
<rect x="583" y="650" width="34" height="14" fill="#fff" stroke="#111" stroke-width="2"/>
<line x1="475" y1="657" x2="493" y2="657" class="thin"/>
<line x1="565" y1="657" x2="583" y2="657" class="thin"/>
<text x="460" y="653" class="tiny">A</text>
<text x="550" y="653" class="tiny">B</text>
<line x1="510" y1="664" x2="510" y2="955" class="wire"/>
<line x1="600" y1="664" x2="600" y2="955" class="wire"/>

<!-- XOR complex style -->
<rect x="720" y="410" width="270" height="300" class="dash"/>
<text x="805" y="435" class="label">XOR</text>
<text x="760" y="455" class="tiny">A⊕B using A/A̅ and B/B̅ pass network</text>
<line x1="760" y1="520" x2="940" y2="520" class="wire"/>
<line x1="760" y1="620" x2="940" y2="620" class="wire"/>
<text x="735" y="525" class="tiny">B</text>
<text x="735" y="625" class="tiny">B̅</text>
<!-- transmission gates to XOR output -->
<line x1="805" y1="520" x2="805" y2="570" class="wire"/>
<rect x="788" y="544" width="34" height="14" fill="#fff" stroke="#111" stroke-width="2"/>
<circle cx="827" cy="551" r="4" fill="#fff" stroke="#111" stroke-width="1.7"/>
<text x="786" y="538" class="tiny">A̅/A</text>
<line x1="850" y1="570" x2="850" y2="620" class="wire"/>
<rect x="833" y="584" width="34" height="14" fill="#fff" stroke="#111" stroke-width="2"/>
<circle cx="872" cy="591" r="4" fill="#fff" stroke="#111" stroke-width="1.7"/>
<text x="832" y="612" class="tiny">A/A̅</text>
<line x1="805" y1="570" x2="920" y2="570" class="wire"/>
<line x1="850" y1="570" x2="920" y2="570" class="wire"/>
<circle cx="920" cy="570" r="4" class="node"/>
<line x1="920" y1="570" x2="1030" y2="570" class="wire"/>
<text x="960" y="562" class="label">XOR</text>

<!-- Full adder simplified transistor-level macro -->
<rect x="1045" y="410" width="270" height="300" class="dash"/>
<text x="1120" y="435" class="label">Full Adder</text>
<text x="1085" y="455" class="tiny">CMOS FA made from XOR + carry network</text>

<!-- full adder transistor network look -->
<line x1="1095" y1="500" x2="1260" y2="500" class="wire"/>
<text x="1070" y="505" class="tiny">A</text>
<line x1="1095" y1="545" x2="1260" y2="545" class="wire"/>
<text x="1070" y="550" class="tiny">B</text>
<line x1="1095" y1="590" x2="1260" y2="590" class="wire"/>
<text x="1062" y="595" class="tiny">Cin</text>
<rect x="1135" y="492" width="34" height="14" fill="#fff" stroke="#111" stroke-width="2"/>
<rect x="1195" y="492" width="34" height="14" fill="#fff" stroke="#111" stroke-width="2"/>
<rect x="1135" y="537" width="34" height="14" fill="#fff" stroke="#111" stroke-width="2"/>
<rect x="1195" y="537" width="34" height="14" fill="#fff" stroke="#111" stroke-width="2"/>
<rect x="1135" y="582" width="34" height="14" fill="#fff" stroke="#111" stroke-width="2"/>
<rect x="1195" y="582" width="34" height="14" fill="#fff" stroke="#111" stroke-width="2"/>
<line x1="1260" y1="545" x2="1355" y2="545" class="wire"/>
<line x1="1260" y1="590" x2="1355" y2="650" class="wire"/>
<text x="1310" y="537" class="label">SUM</text>
<text x="1310" y="666" class="label">Cout</text>

<!-- MUX section -->
<rect x="300" y="730" width="1150" height="190" class="dash"/>
<text x="760" y="755" class="label">Three 2:1 Transmission-Gate MUXes</text>

<!-- MUX1 -->
<text x="355" y="785" class="label">MUX1</text>
<line x1="430" y1="544" x2="430" y2="780" class="wire"/>
<line x1="700" y1="590" x2="700" y2="830" class="wire"/>
<line x1="430" y1="780" x2="520" y2="780" class="wire"/>
<line x1="700" y1="830" x2="520" y2="830" class="wire"/>
<rect x="520" y="773" width="34" height="14" fill="#fff" stroke="#111" stroke-width="2"/>
<circle cx="559" cy="780" r="4" fill="#fff" stroke="#111" stroke-width="1.7"/>
<rect x="520" y="823" width="34" height="14" fill="#fff" stroke="#111" stroke-width="2"/>
<circle cx="559" cy="830" r="4" fill="#fff" stroke="#111" stroke-width="1.7"/>
<line x1="554" y1="780" x2="615" y2="805" class="wire"/>
<line x1="554" y1="830" x2="615" y2="805" class="wire"/>
<circle cx="615" cy="805" r="4" class="node"/>
<line x1="615" y1="805" x2="705" y2="805" class="wire"/>
<text x="610" y="790" class="tiny">Logic0</text>
<text x="525" y="765" class="tiny">S̅0/S0</text>
<text x="525" y="855" class="tiny">S0/S̅0</text>

<!-- MUX2 -->
<text x="760" y="785" class="label">MUX2</text>
<line x1="1030" y1="570" x2="1030" y2="780" class="wire"/>
<line x1="1355" y1="545" x2="1355" y2="830" class="wire"/>
<line x1="1030" y1="780" x2="920" y2="780" class="wire"/>
<line x1="1355" y1="830" x2="920" y2="830" class="wire"/>
<rect x="886" y="773" width="34" height="14" fill="#fff" stroke="#111" stroke-width="2"/>
<circle cx="925" cy="780" r="4" fill="#fff" stroke="#111" stroke-width="1.7"/>
<rect x="886" y="823" width="34" height="14" fill="#fff" stroke="#111" stroke-width="2"/>
<circle cx="925" cy="830" r="4" fill="#fff" stroke="#111" stroke-width="1.7"/>
<line x1="920" y1="780" x2="980" y2="805" class="wire"/>
<line x1="920" y1="830" x2="980" y2="805" class="wire"/>
<circle cx="980" cy="805" r="4" class="node"/>
<line x1="980" y1="805" x2="1070" y2="805" class="wire"/>
<text x="975" y="790" class="tiny">Logic1</text>
<text x="888" y="765" class="tiny">S̅0/S0</text>
<text x="888" y="855" class="tiny">S0/S̅0</text>

<!-- MUX3 -->
<text x="1125" y="785" class="label">MUX3</text>
<line x1="705" y1="805" x2="1160" y2="805" class="wire"/>
<line x1="1070" y1="805" x2="1160" y2="855" class="wire"/>
<rect x="1160" y="798" width="34" height="14" fill="#fff" stroke="#111" stroke-width="2"/>
<circle cx="1199" cy="805" r="4" fill="#fff" stroke="#111" stroke-width="1.7"/>
<rect x="1160" y="848" width="34" height="14" fill="#fff" stroke="#111" stroke-width="2"/>
<circle cx="1199" cy="855" r="4" fill="#fff" stroke="#111" stroke-width="1.7"/>
<line x1="1194" y1="805" x2="1265" y2="830" class="wire"/>
<line x1="1194" y1="855" x2="1265" y2="830" class="wire"/>
<circle cx="1265" cy="830" r="4" class="node"/>
<line x1="1265" y1="830" x2="1480" y2="830" class="wire"/>
<text x="1490" y="836" class="label">RESULT</text>
<text x="1162" y="790" class="tiny">S̅1/S1</text>
<text x="1162" y="880" class="tiny">S1/S̅1</text>

<!-- Cout output -->
<line x1="1355" y1="650" x2="1480" y2="650" class="wire"/>
<text x="1490" y="656" class="label">Cout</text>

<!-- operation labels -->
<rect x="1180" y="115" width="300" height="125" fill="#fff" stroke="#111" stroke-width="1.8"/>
<text x="1200" y="145" class="label">Select Table</text>
<text x="1200" y="172" class="small">S1S0 = 00 → AND</text>
<text x="1200" y="195" class="small">S1S0 = 01 → NOR</text>
<text x="1200" y="218" class="small">S1S0 = 10 → XOR</text>
<text x="1200" y="241" class="small">S1S0 = 11 → ADD/SUM</text>

<!-- inverter reminder -->
<rect x="80" y="115" width="250" height="80" fill="#fff" stroke="#111" stroke-width="1.8"/>
<text x="100" y="143" class="small">Note: A̅, B̅, C̅in, S̅0, S̅1</text>
<text x="100" y="168" class="small">come from CMOS inverters.</text>

