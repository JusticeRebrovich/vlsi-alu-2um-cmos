<?xml version="1.0" encoding="UTF-8"?>
<svg width="1400" height="850" viewBox="0 0 1400 850" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#111"/>
    </marker>
    <style>
      .wire { stroke:#111; stroke-width:2.2; fill:none; marker-end:url(#arrow); }
      .wire2 { stroke:#111; stroke-width:2.2; fill:none; }
      .box { fill:#fff; stroke:#111; stroke-width:2.2; rx:14; }
      .smallbox { fill:#fafafa; stroke:#111; stroke-width:1.8; rx:10; }
      .label { font-family: Arial, sans-serif; font-size:20px; fill:#111; }
      .small { font-family: Arial, sans-serif; font-size:15px; fill:#111; }
      .tiny { font-family: Arial, sans-serif; font-size:13px; fill:#111; }
      .title { font-family: Arial, sans-serif; font-size:30px; font-weight:bold; fill:#111; }
      .subtitle { font-family: Arial, sans-serif; font-size:17px; fill:#333; }
      .pmos { stroke:#111; stroke-width:2; fill:none; }
      .nmos { stroke:#111; stroke-width:2; fill:none; }
      .rail { stroke:#111; stroke-width:2.4; }
      .dashed { stroke:#666; stroke-width:1.5; stroke-dasharray:6,5; fill:none; }
    </style>
  </defs>

  <text x="50" y="45" class="title">1-Bit CMOS ALU Cell — transistor-level block diagram</text>
  <text x="50" y="75" class="subtitle">Uses: 3 transmission-gate 2:1 MUXes, 1 full adder, 1 XOR, 1 NOR, and 1 AND</text>

  <!-- Inputs -->
  <text x="50" y="135" class="label">A</text>
  <line x1="80" y1="130" x2="230" y2="130" class="wire2"/>
  <text x="50" y="185" class="label">B</text>
  <line x1="80" y1="180" x2="230" y2="180" class="wire2"/>
  <text x="50" y="235" class="label">Cin</text>
  <line x1="95" y1="230" x2="230" y2="230" class="wire2"/>

  <text x="50" y="720" class="label">S0</text>
  <line x1="85" y1="715" x2="1040" y2="715" class="wire2"/>
  <text x="50" y="765" class="label">S1</text>
  <line x1="85" y1="760" x2="1110" y2="760" class="wire2"/>

  <!-- Logic blocks -->
  <rect x="260" y="95" width="230" height="95" class="box"/>
  <text x="315" y="130" class="label">CMOS AND</text>
  <text x="290" y="158" class="small">A · B</text>
  <text x="360" y="158" class="tiny">NAND + inverter</text>

  <rect x="260" y="220" width="230" height="95" class="box"/>
  <text x="315" y="255" class="label">CMOS NOR</text>
  <text x="290" y="283" class="small">A + B</text>
  <line x1="330" y1="276" x2="373" y2="276" stroke="#111" stroke-width="1.8"/>
  <text x="360" y="283" class="tiny">direct CMOS</text>

  <rect x="260" y="345" width="230" height="95" class="box"/>
  <text x="315" y="380" class="label">CMOS XOR</text>
  <text x="290" y="408" class="small">A ⊕ B</text>
  <text x="360" y="408" class="tiny">static CMOS / TG style</text>

  <rect x="260" y="485" width="260" height="125" class="box"/>
  <text x="318" y="520" class="label">Full Adder</text>
  <text x="290" y="552" class="small">SUM = A ⊕ B ⊕ Cin</text>
  <text x="290" y="578" class="small">Cout = AB + Cin(A ⊕ B)</text>

  <!-- Wires from inputs to blocks -->
  <path d="M230 130 L245 130 L245 120 L260 120" class="wire"/>
  <path d="M230 180 L245 180 L245 160 L260 160" class="wire"/>
  <path d="M230 130 L235 130 L235 245 L260 245" class="wire"/>
  <path d="M230 180 L240 180 L240 285 L260 285" class="wire"/>
  <path d="M230 130 L225 130 L225 370 L260 370" class="wire"/>
  <path d="M230 180 L230 410 L260 410" class="wire"/>
  <path d="M230 130 L220 130 L220 515 L260 515" class="wire"/>
  <path d="M230 180 L225 180 L225 550 L260 550" class="wire"/>
  <path d="M230 230 L245 230 L245 585 L260 585" class="wire"/>

  <!-- MUX blocks -->
  <polygon points="660,145 790,100 790,265 660,220" fill="#fff" stroke="#111" stroke-width="2.2"/>
  <text x="695" y="170" class="label">MUX1</text>
  <text x="681" y="198" class="small">2:1 TG</text>
  <text x="684" y="232" class="tiny">S0 selects AND/NOR</text>

  <polygon points="660,410 790,365 790,530 660,485" fill="#fff" stroke="#111" stroke-width="2.2"/>
  <text x="695" y="435" class="label">MUX2</text>
  <text x="681" y="463" class="small">2:1 TG</text>
  <text x="684" y="497" class="tiny">S0 selects XOR/SUM</text>

  <polygon points="980,290 1130,235 1130,430 980,375" fill="#fff" stroke="#111" stroke-width="2.2"/>
  <text x="1025" y="315" class="label">MUX3</text>
  <text x="1010" y="345" class="small">2:1 TG</text>
  <text x="1000" y="382" class="tiny">S1 selects logic/add side</text>

  <!-- Logic outputs into muxes -->
  <path d="M490 142 L660 160" class="wire"/>
  <text x="535" y="135" class="tiny">AND</text>
  <path d="M490 267 L660 205" class="wire"/>
  <text x="535" y="260" class="tiny">NOR</text>

  <path d="M490 392 L660 425" class="wire"/>
  <text x="535" y="385" class="tiny">XOR</text>
  <path d="M520 545 L660 475" class="wire"/>
  <text x="545" y="530" class="tiny">SUM</text>

  <!-- Cout -->
  <path d="M520 585 L1225 585" class="wire"/>
  <text x="1240" y="592" class="label">Cout</text>

  <!-- MUX tree output wires -->
  <path d="M790 182 L980 315" class="wire"/>
  <path d="M790 447 L980 360" class="wire"/>
  <path d="M1130 333 L1225 333" class="wire"/>
  <text x="1240" y="340" class="label">Result</text>

  <!-- Select wires to muxes -->
  <path d="M710 715 L710 250" class="wire"/>
  <text x="720" y="685" class="tiny">S0</text>
  <path d="M740 715 L740 515" class="wire"/>
  <path d="M1065 760 L1065 425" class="wire"/>
  <text x="1075" y="735" class="tiny">S1</text>

  <!-- Transistor-level legend -->
  <rect x="50" y="520" width="180" height="160" class="smallbox"/>
  <text x="70" y="550" class="label">TG MUX cell</text>
  <text x="70" y="575" class="tiny">Each 2:1 mux uses</text>
  <text x="70" y="595" class="tiny">two transmission gates.</text>
  <text x="70" y="620" class="tiny">Each TG = PMOS || NMOS</text>
  <text x="70" y="645" class="tiny">controlled by S and S̅.</text>

  <!-- draw mini transmission gate -->
  <line x1="70" y1="665" x2="105" y2="665" class="rail"/>
  <line x1="165" y1="665" x2="205" y2="665" class="rail"/>
  <circle cx="125" cy="658" r="5" class="pmos"/>
  <line x1="115" y1="658" x2="145" y2="658" class="pmos"/>
  <line x1="115" y1="672" x2="145" y2="672" class="nmos"/>
  <line x1="145" y1="665" x2="165" y2="665" class="rail"/>
  <text x="95" y="705" class="tiny">S / S̅ gates</text>

  <!-- Operation table -->
  <rect x="870" y="95" width="430" height="115" class="smallbox"/>
  <text x="895" y="125" class="label">Operation Select</text>
  <text x="900" y="155" class="small">S1 S0 = 00 → AND</text>
  <text x="1060" y="155" class="small">S1 S0 = 01 → NOR</text>
  <text x="900" y="185" class="small">S1 S0 = 10 → XOR</text>
  <text x="1060" y="185" class="small">S1 S0 = 11 → ADD/SUM</text>

  <!-- Transistor count note -->
  <rect x="870" y="625" width="430" height="145" class="smallbox"/>
  <text x="895" y="655" class="label">Typical CMOS transistor count</text>
  <text x="900" y="685" class="small">3 TG MUXes ≈ 12 transistors total</text>
  <text x="900" y="710" class="small">AND ≈ 6, NOR ≈ 4, XOR ≈ 8–12</text>
  <text x="900" y="735" class="small">Full adder depends on chosen CMOS style</text>
  <text x="900" y="760" class="tiny">Use this as the top-level transistor-level ALU plan.</text>

  <!-- dashed transistor-level implementation enclosure -->
  <rect x="245" y="85" width="910" height="535" class="dashed"/>
  <text x="570" y="640" class="subtitle">Inside each block, use CMOS transistor networks; muxes should be transmission-gate based.</text>
</svg>
